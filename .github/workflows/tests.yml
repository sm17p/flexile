# .github/workflows/tests.yml
name: Tests

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
  RAILS_ENV: test
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
  WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}
  NODE_TLS_REJECT_UNAUTHORIZED: 0

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Generate and output the cache key for test jobs
      - name: Generate cache key
        id: cache-key
        run: |
          CACHE_KEY="setup-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock', '**/pnpm-lock.yaml') }}-${{ github.sha }}"
          echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "Cache key: $CACHE_KEY"

      # Enhanced caching strategy
      - name: Restore Ruby gems
        uses: actions/cache/restore@v4
        with:
          path: backend/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('backend/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-

      - name: Restore pnpm dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Restore Next build
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            frontend/.next/cache
            frontend/node_modules/.cache
            frontend/.next
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.{ts,tsx}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Build setup
        uses: ./.github/common/

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: node docker/createCertificate.js

      - run: NODE_ENV=test pnpm run build-next
        shell: bash

      - name: Install foreman
        run: gem install foreman

      # Cache the complete setup
      - name: Cache complete setup
        uses: actions/cache/save@v4
        with:
          path: |
            backend/vendor/bundle
            node_modules
            frontend/node_modules
            frontend/.next
            ~/.cache/ms-playwright
            certificates
          key: setup-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock', '**/pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Run docker compose
        run: docker compose -f docker/docker-compose-local-linux.yml up -d

      - name: Run Playwright tests
        run: pnpm playwright test


      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
