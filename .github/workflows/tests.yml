# .github/workflows/tests.yml
name: Tests

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RAILS_ENV: test
  NODE_TLS_REJECT_UNAUTHORIZED: 0

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - uses: actions/checkout@v4

      # Generate and output the cache key for test jobs
      - name: Generate cache key
        id: cache-key
        run: |
          CACHE_KEY="setup-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock', '**/pnpm-lock.yaml') }}-${{ github.sha }}"
          echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "Cache key: $CACHE_KEY"

      # Enhanced caching strategy
      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: backend/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('backend/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Next build
        id: next-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
            frontend/node_modules/.cache
            frontend/.next
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: ./.github/common/

      - name: Install all dependencies and tools
        run: |
          set -e  # Exit on any error
          REPO_ROOT=$(pwd)

          # Configure bundler to use cache
          cd "$REPO_ROOT/backend"
          bundle config path vendor/bundle
          bundle install --jobs 4 &
          BUNDLE_PID=$!

          # Install pnpm deps from root
          cd "$REPO_ROOT"
          pnpm install &
          PNPM_PID=$!

          # Install Playwright browsers if not cached
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm playwright install --with-deps chromium &
            PLAYWRIGHT_PID=$!
          fi

          # Install foreman
          gem install foreman &
          GEM_PID=$!

          # Wait for all installations and check exit codes
          wait $BUNDLE_PID || { echo "Bundle install failed"; exit 1; }
          wait $PNPM_PID || { echo "pnpm install failed"; exit 1; }
          wait $GEM_PID || { echo "Gem install failed"; exit 1; }

          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            wait $PLAYWRIGHT_PID || { echo "Playwright install failed"; exit 1; }
          fi

          echo "All dependencies and tools installed successfully!"


      - name: Build Next.js
        run: |
          if [ ! -d "frontend/.next" ] || [ "${{ steps.next-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Building Next.js..."
            NODE_ENV=test pnpm run build-next --no-lint
          else
            echo "Using cached Next.js build"
          fi

      # Cache the complete setup for test jobs
      - name: Cache complete setup
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor/bundle
            node_modules
            frontend/node_modules
            frontend/.next
            ~/.cache/ms-playwright
            certificates
          key: ${{ steps.cache-key.outputs.key }}

      # Signal that setup is complete
      - name: Signal setup completion
        run: |
          echo "✅ Setup completed successfully!"
          echo "Cache key: ${{ steps.cache-key.outputs.key }}"

  playwright-tests:
    name: playwright-${{ matrix.shardIndex }}
    runs-on: ubuntu-latest
    needs: setup  # Keep dependency but start services early
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flexile_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.2
        ports:
          - 6389:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/common/

      # Simple and reliable cache restore with debugging
      - name: Restore setup cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor/bundle
            node_modules
            frontend/node_modules
            frontend/.next
            ~/.cache/ms-playwright
            certificates
          key: setup-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock', '**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            setup-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock', '**/pnpm-lock.yaml') }}-
            setup-${{ runner.os }}-

      # Debug cache status
      - name: Debug cache status
        run: |
          echo "🔍 Cache Debug Info:"
          echo "Cache hit: ${{ steps.restore-cache.outputs.cache-hit }}"
          echo "Cache matched key: ${{ steps.restore-cache.outputs.cache-matched-key }}"
          echo "Primary key: setup-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock', '**/pnpm-lock.yaml') }}-${{ github.sha }}"
          echo ""
          echo "📁 Checking what was restored:"
          ls -la backend/vendor/bundle/ 2>/dev/null || echo "❌ No bundle directory"
          ls -la node_modules/ 2>/dev/null || echo "❌ No node_modules"
          ls -la frontend/.next/ 2>/dev/null || echo "❌ No Next.js build"
          ls -la certificates/ 2>/dev/null || echo "❌ No certificates"
          ls -la ~/.cache/ms-playwright/ 2>/dev/null || echo "❌ No Playwright browsers"

      - name: Verify setup
        run: |
          echo "🔍 Verifying setup files exist..."
          ls -la backend/vendor/bundle/ || echo "⚠️ Bundle not found"
          ls -la node_modules/ || echo "⚠️ Node modules not found"
          ls -la frontend/.next/ || echo "⚠️ Next build not found"
          ls -la certificates/ || echo "⚠️ Certificates not found"
          ls -la ~/.cache/ms-playwright/ || echo "⚠️ Playwright not found"
          echo "✅ Setup verification complete"

      - name: Install all dependencies and tools
        run: |
          set -e  # Exit on any error

          # Install system dependencies first (can't be parallelized)
          sudo apt-get update -qq        # fetch fresh index
          sudo apt-get install -y libnss3-tools    # install what you need
          sudo apt-get clean             # drop downloaded .debs
          sudo rm -rf /var/lib/apt/lists/*

          # Download mkcert binary
          curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64" &
          MKCERT_DOWNLOAD_PID=$!

          # Wait for mkcert download and install it
          wait $MKCERT_DOWNLOAD_PID || { echo "mkcert download failed"; exit 1; }
          chmod +x mkcert-v*-linux-amd64
          sudo cp mkcert-v*-linux-amd64 /usr/local/bin/mkcert &
          MKCERT_INSTALL_PID=$!

          # Wait for all installations and check exit codes
          wait $MKCERT_INSTALL_PID || { echo "mkcert install failed"; exit 1; }

          echo "All dependencies and tools installed successfully!"


      - name: Create certificates & Trust self-signed certificates (Playwright only)
        run: |
          mkdir -p certificates
          node docker/createCertificate.js

          if [ -f "certificates/rootCA.pem" ]; then
            sudo cp certificates/rootCA.pem /usr/local/share/ca-certificates/mkcert-rootCA.crt
            sudo update-ca-certificates
          fi

      - name: Setup test database
        run: |
          cd backend
          bundle config path vendor/bundle
          bundle exec rails db:drop db:create db:schema:load

      - name: Start all services
        run: |
          ./bin/test_server

          # Parallel health checks with faster polling
          echo "Waiting for services to start..."
          timeout 30 bash -c 'until curl -s http://localhost:3100/health > /dev/null 2>&1; do sleep 0.5; done' &
          RAILS_HEALTH=$!

          timeout 30 bash -c 'until curl -k https://test.flexile.dev:3101/api/health > /dev/null 2>&1; do sleep 0.5; done' &
          NEXT_HEALTH=$!

          # Wait for health checks to complete
          wait $RAILS_HEALTH $NEXT_HEALTH
          echo "All services are ready!"

      - name: Run Playwright tests
        run: |
          echo "🎭 Running Playwright tests for shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
          pnpm playwright test \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --workers=2 \
            --max-failures=5
        timeout-minutes: 10

      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load test environment
        run: |
          if [ -f .env.test ]; then
            echo "Loading environment from .env.test"
            cat .env.test >> $GITHUB_ENV
          fi

      - uses: ./.github/common/

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: pnpm playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
