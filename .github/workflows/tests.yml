# .github/workflows/tests.yml
name: Tests

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RAILS_ENV: test
  NODE_TLS_REJECT_UNAUTHORIZED: 0
  # Secrets that need to be injected
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  WISE_API_KEY: ${{ secrets.WISE_API_KEY }}
  WISE_PROFILE_ID: ${{ secrets.WISE_PROFILE_ID }}

jobs:
  rspec:
    runs-on: ubicloud-standard-2

    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flexile_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.2
        ports:
          - 6389:6379
        options: --entrypoint redis-server

    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [2]
        ci_node_index: [0, 1]

    steps:
      - uses: actions/checkout@v4

      # Enhanced caching for dependencies
      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: backend/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('backend/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Build setup
        uses: ./.github/common/

      # Parallel dependency installation
      - name: Install dependencies in parallel
        run: |
          # Configure bundler to use cache
          cd backend
          bundle config path vendor/bundle
          bundle install --jobs 4 &
          BUNDLE_PID=$!

          # Install pnpm deps in parallel
          cd ..
          pnpm install &
          PNPM_PID=$!

          # Wait for both
          wait $BUNDLE_PID $PNPM_PID

      # Optimized database setup
      - name: Setup test database
        run: |
          cd backend
          bundle exec rails db:create &
          CREATE_PID=$!
          wait $CREATE_PID
          bundle exec rails db:schema:load

      - name: Run tests
        env:
          RUBY_YJIT_ENABLE: 1
          KNAPSACK_PRO_TEST_SUITE_TOKEN_RSPEC: ${{ secrets.KNAPSACK_PRO_TEST_SUITE_TOKEN_RSPEC }}
          KNAPSACK_PRO_CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
          KNAPSACK_PRO_CI_NODE_INDEX: ${{ matrix.ci_node_index }}
          KNAPSACK_PRO_LOG_LEVEL: info
        run: cd backend && bundle exec rake "knapsack_pro:queue:rspec[--format RSpec::Github::Formatter --tag ~skip --tag ~type:system --format progress]"
        timeout-minutes: 20

  playwright-tests:
    name: playwright-${{ matrix.shardIndex }}
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flexile_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.2
        ports:
          - 6389:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      # Enhanced caching strategy
      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: backend/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('backend/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Next build
        id: next-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
            frontend/node_modules/.cache
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: ./.github/common/

      # Load environment from .env.test file
      - name: Load test environment
        run: |
          if [ -f .env.test ]; then
            echo "Loading environment from .env.test"
            cat .env.test >> $GITHUB_ENV
          fi

      # Load environment from .env.test file
      - name: Load test environment
        run: |
          if [ -f .env.test ]; then
            echo "Loading environment from .env.test"
            cat .env.test >> $GITHUB_ENV
          fi

      # Parallel dependency installation
      - name: Install all dependencies in parallel
        run: |
          # Configure bundler to use cache
          cd backend
          bundle config path vendor/bundle
          bundle install --jobs 4 &
          BUNDLE_PID=$!

          # Install pnpm deps
          cd ..
          pnpm install &
          PNPM_PID=$!

          # Install Playwright browsers if not cached
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm playwright install --with-deps chromium &
            PLAYWRIGHT_PID=$!
          fi

          # Install foreman
          gem install foreman &
          GEM_PID=$!

          # Wait for all installations
          wait $BUNDLE_PID $PNPM_PID
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            wait $PLAYWRIGHT_PID
          fi
          wait $GEM_PID

      # Optimized certificate setup
      - name: Create & trust self-signed certificates
        run: |
          mkdir -p certificates
          node docker/createCertificate.js
          cp "$(mkcert -CAROOT)/flexile.dev.pem" certificates/flexile.dev.crt
          cp "$(mkcert -CAROOT)/flexile.dev-key.pem" certificates/flexile.dev.key
          sudo cp "$(mkcert -CAROOT)/rootCA.pem" /usr/local/share/ca-certificates/mkcert-rootCA.crt
          sudo update-ca-certificates

      # Smart build caching
      - name: Build Next.js (skip if cached)
        run: |
          if [ ! -d "frontend/.next" ] || [ "${{ steps.next-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Building Next.js..."
            NODE_ENV=test pnpm run build-next --no-lint
          else
            echo "Using cached Next.js build"
          fi

      # Optimized database setup
      - name: Setup test database in parallel
        run: |
          cd backend
          bundle exec rails db:create &
          CREATE_PID=$!
          wait $CREATE_PID
          bundle exec rails db:schema:load &
          SCHEMA_PID=$!
          bundle exec rails db:seed_test_data &
          SEED_PID=$!
          wait $SCHEMA_PID $SEED_PID

      # Parallel service startup with optimized health checks
      - name: Start all services in parallel
        run: |
          cd backend

          # Start Rails server
          bundle exec rails server -p 3100 -e test -b 0.0.0.0 &
          RAILS_PID=$!

          # Start Sidekiq
          bundle exec sidekiq -q default -q mailers &
          SIDEKIQ_PID=$!

          # Start Next.js
          cd ..
          pnpm next start frontend \
            --hostname 0.0.0.0 \
            --port 3101 \
            --experimental-https \
            --experimental-https-key certificates/flexile.dev.key \
            --experimental-https-cert certificates/flexile.dev.crt &
          NEXT_PID=$!

          # Start Inngest
          pnpm inngest-cli dev --no-discovery -p 8298 -u https://test.flexile.dev:3101/api/inngest &
          INNGEST_PID=$!

          # Parallel health checks with faster polling
          echo "Waiting for services to start..."
          timeout 30 bash -c 'until curl -s http://localhost:3100/health > /dev/null 2>&1; do sleep 0.5; done' &
          RAILS_HEALTH=$!

          timeout 30 bash -c 'until curl -k https://test.flexile.dev:3101/api/health > /dev/null 2>&1; do sleep 0.5; done' &
          NEXT_HEALTH=$!

          # Wait for health checks to complete
          wait $RAILS_HEALTH $NEXT_HEALTH
          echo "All services are ready!"

      # Optimized test execution
      - name: Run Playwright tests
        run: |
          pnpm playwright test \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --workers=2 \
            --max-failures=5
        timeout-minutes: 45

      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    # Merge reports after playwright-tests, even if some shards have failed
    if: ${{ !cancelled() }}
    needs: [playwright-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load test environment
        run: |
          if [ -f .env.test ]; then
            echo "Loading environment from .env.test"
            cat .env.test >> $GITHUB_ENV
          fi

      - uses: ./.github/common/

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: pnpm playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
